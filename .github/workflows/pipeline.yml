name: Build & Deploy

on:
  push:
    paths:
      - 'python/**'
      - 'go/**'
      - 'nodejs/**'
      - 'nginx/**'
  pull_request:
    paths:
      - 'python/**'
      - 'go/**'
      - 'nodejs/**'
      - 'nginx/**'

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      stack: ${{ steps.resolve-env.outputs.stack }}
      tag: ${{ steps.resolve-env.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes in services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python: 'python/**'
            go: 'go/**'
            nodejs: 'nodejs/**'
            nginx: 'nginx/**'

      - name: Resolve target environment
        id: resolve-env
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "stack=stage" >> "$GITHUB_OUTPUT"
            echo "tag=stage"   >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "stack=prod"   >> "$GITHUB_OUTPUT"
            echo "tag=latest"   >> "$GITHUB_OUTPUT"
          else
            echo "stack=dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev"   >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.service }}-${{ github.sha }}
            type=raw,value=${{ matrix.service }}-${{ needs.detect-changes.outputs.tag }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: [detect-changes, build]
    # build is skipped entirely when nothing changed - still ok to deploy in that
    # case (e.g. workflow file edits), but skip if build actually failed
    if: ${{ !failure() && !cancelled() }}
    runs-on: self-hosted
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Force rolling update
        run: |
          sudo docker service ls --filter label=com.docker.stack.namespace=${{ needs.detect-changes.outputs.stack }} --format '{{.Name}}' \
            | xargs -r -I{} sudo docker service update --force --with-registry-auth {}

  verify:
    needs: [detect-changes, deploy]
    runs-on: self-hosted
    steps:
      - name: Wait for services to converge
        run: |
          stack="${{ needs.detect-changes.outputs.stack }}"
          services=$(sudo docker service ls --filter label=com.docker.stack.namespace=$stack --format '{{.Name}}')

          for svc in $services; do
            echo "Waiting for $svc to stabilize..."
            for i in $(seq 1 30); do
              desired=$(sudo docker service inspect "$svc" --format '{{.Spec.Mode.Replicated.Replicas}}')
              running=$(sudo docker service ls --filter "name=$svc" --format '{{.Replicas}}' | cut -d/ -f1)
              [ "$running" = "$desired" ] && break
              sleep 5
            done
            [ "$running" = "$desired" ] || { echo "::error::$svc did not converge ($running/$desired)"; exit 1; }
          done

      - name: Health-check endpoints
        run: |
          case "${{ needs.detect-changes.outputs.stack }}" in
            prod)  port=80 ;;
            stage) port=8080 ;;
            dev)   port=8081 ;;
          esac

          for path in go nodejs python; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:${port}/${path}/health")
            [ "$code" = "200" ] || { echo "::error::${path} health check failed (HTTP $code)"; exit 1; }
          done

          echo "All health checks passed for ${{ needs.detect-changes.outputs.stack }}"
