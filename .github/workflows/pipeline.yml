name: Build & Deploy

on:
  push:
    branches-ignore: [main]
    paths: ['python/**', 'go/**', 'nodejs/**', 'nginx/**']
  pull_request:
    types: [opened, synchronize, closed]
    paths: ['python/**', 'go/**', 'nodejs/**', 'nginx/**']

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      stack: ${{ steps.resolve-env.outputs.stack }}
      tag: ${{ steps.resolve-env.outputs.tag }}
      sha: ${{ steps.resolve-env.outputs.sha }}
      promote_only: ${{ steps.resolve-env.outputs.promote_only }}
      image_base: ${{ steps.image-base.outputs.value }}
    steps:
      - id: image-base
        run: echo "value=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python: 'python/**'
            go: 'go/**'
            nodejs: 'nodejs/**'
            nginx: 'nginx/**'

      - id: resolve-env
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "stack=dev"       >> "$GITHUB_OUTPUT"
            echo "tag=dev"         >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "promote_only=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" != "closed" ]; then
            echo "stack=stage" >> "$GITHUB_OUTPUT"
            echo "tag=stage"   >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "promote_only=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.action }}" = "closed" ] && [ "${{ github.event.pull_request.merged }}" = "true" ]; then
            echo "stack=prod"  >> "$GITHUB_OUTPUT"
            echo "tag=latest"  >> "$GITHUB_OUTPUT"
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
            echo "promote_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "promote_only=skip" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.promote_only == 'false' && needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push (sha + floating dev tag)
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}  
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ needs.detect-changes.outputs.image_base }}:${{ matrix.service }}-${{ needs.detect-changes.outputs.sha }}
            ${{ needs.detect-changes.outputs.image_base }}:${{ matrix.service }}-${{ needs.detect-changes.outputs.tag }}
  promote:
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.promote_only == 'true' && needs.detect-changes.outputs.services != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Retag existing sha-image as env tag (no rebuild)
        run: |
          docker buildx imagetools create \
            -t ${{ needs.detect-changes.outputs.image_base }}:${{ matrix.service }}-${{ needs.detect-changes.outputs.tag }} \
            ${{ needs.detect-changes.outputs.image_base }}:${{ matrix.service }}-${{ needs.detect-changes.outputs.sha }}

  deploy:
    needs: [detect-changes, build, promote]
    if: ${{ !failure() && !cancelled() && needs.detect-changes.outputs.promote_only != 'skip' && needs.detect-changes.outputs.services != '[]' }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GHCR_PAT }}" | sudo docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Resolve compose service name
        id: svc
        run: |
          case "${{ matrix.service }}" in
            nginx)  name=nginx ;;
            python) name=python-app ;;
            nodejs) name=nodejs-app ;;
            go)     name=go-app ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Pull & update service
        run: |
          image="${{ needs.detect-changes.outputs.image_base }}:${{ matrix.service }}-${{ needs.detect-changes.outputs.tag }}"
          full_svc="${{ needs.detect-changes.outputs.stack }}_${{ steps.svc.outputs.name }}"
          sudo docker pull "$image"
          sudo docker service update --with-registry-auth --image "$image" "$full_svc"

  verify:
    needs: [detect-changes, deploy]
    if: ${{ !failure() && !cancelled() && needs.detect-changes.outputs.promote_only != 'skip' && needs.detect-changes.outputs.services != '[]' }}
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Resolve compose service name
        id: svc
        run: |
          case "${{ matrix.service }}" in
            nginx)  name=nginx ;;
            python) name=python-app ;;
            nodejs) name=nodejs-app ;;
            go)     name=go-app ;;
          esac
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Wait for service to converge
        run: |
          full_svc="${{ needs.detect-changes.outputs.stack }}_${{ steps.svc.outputs.name }}"
          for i in $(seq 1 30); do
            desired=$(sudo docker service inspect "$full_svc" --format '{{.Spec.Mode.Replicated.Replicas}}')
            running=$(sudo docker service ls --filter "name=$full_svc" --format '{{.Replicas}}' | cut -d/ -f1)
            [ "$running" = "$desired" ] && break
            sleep 5
          done
          [ "$running" = "$desired" ] || { echo "::error::$full_svc did not converge ($running/$desired)"; exit 1; }

      - name: Health-check endpoint
        run: |
          case "${{ needs.detect-changes.outputs.stack }}" in
            prod)  port=80 ;;
            stage) port=8080 ;;
            dev)   port=8081 ;;
          esac

          if [ "${{ matrix.service }}" = "nginx" ]; then
            url="http://127.0.0.1:${port}/health"
          else
            url="http://127.0.0.1:${port}/${{ matrix.service }}/health"
          fi

          code=$(curl -s -o /dev/null -w '%{http_code}' "$url")
          [ "$code" = "200" ] || { echo "::error::$url failed (HTTP $code)"; exit 1; }
