version: "3.9"

services:
  nginx:
    image: ${BASE_REGISTRY}:nginx-${IMG_TAG}
    ports:
      - "${HOST_PORT}:80"
    networks:
      - web-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==${NODE_TAG}"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          memory: 64M

  python-app:
    image: ${BASE_REGISTRY}:python-${IMG_TAG}
    networks:
      - web-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==${NODE_TAG}"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  nodejs-app:
    image: ${BASE_REGISTRY}:nodejs-${IMG_TAG}
    networks:
      - web-network
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==${NODE_TAG}"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

  go-app:
    image: ${BASE_REGISTRY}:go-${IMG_TAG}
    networks:
      - web-network
    healthcheck:
      test: [ "CMD", "/app", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==${NODE_TAG}"
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M

networks:
  web-network:
    driver: overlay
