version: "3.9"

services:
  nginx:
    image: ${BASE_REGISTRY}:nginx-${IMG_TAG}
    ports:
      - "${HOST_PORT}:80"
    networks:
      - web-network
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==${NODE_TAG}"

  python-app:
    image: ${BASE_REGISTRY}:python-${IMG_TAG}
    networks:
      - web-network
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==${NODE_TAG}"

  nodejs-app:
    image: ${BASE_REGISTRY}:nodejs-${IMG_TAG}
    networks:
      - web-network
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==${NODE_TAG}"

  go-app:
    image: ${BASE_REGISTRY}:go-${IMG_TAG}
    networks:
      - web-network
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==${NODE_TAG}"

networks:
  web-network:
    driver: overlay
