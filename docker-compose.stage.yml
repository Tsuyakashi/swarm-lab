services:
  nginx:
    image: ${BASE_REGISTRY}:nginx-stage
    container_name: nginx-proxy
    ports:
      - "8080:80"
    networks:
      - web-network
    restart: unless-stopped
    depends_on:
      - go-app
      - nodejs-app
      - python-app
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==stage"

  python-app:
    image: ${BASE_REGISTRY}:python-stage
    container_name: python-app
    expose:
      - "8080"
    networks:
      - web-network
    restart: unless-stopped
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==stage"

  nodejs-app:
    image: ${BASE_REGISTRY}:nodejs-stage
    container_name: nodejs-app
    expose:
      - "8080"
    networks:
      - web-network
    restart: unless-stopped
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==stage"

  go-app:
    image: ${BASE_REGISTRY}:go-stage
    container_name: go-app
    expose:
      - "8080"
    networks:
      - web-network
    restart: unless-stopped
    deploy:
      placement:
        constraints:
          - "node.labels.TAG==stage"

networks:
  web-network:
    driver: overlay
