services:
  # TODO: add tags to download images from gchr.io prod > stage > dev or build
  nginx:
    build: ./nginx
    container_name: nginx-proxy
    ports:
      - "${HOST_PORT:-8000}:80"
    networks:
      - web-network
    restart: unless-stopped
    depends_on:
      go-app:
        condition: service_healthy
      nodejs-app:
        condition: service_healthy
      python-app:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  python-app:
    build: ./python
    container_name: python-app
    expose:
      - "8080"
    networks:
      - web-network
    restart: unless-stopped
    init: true
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health').status==200 else 1)" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  nodejs-app:
    build: ./nodejs
    container_name: nodejs-app
    expose:
      - "8080"
    networks:
      - web-network
    restart: unless-stopped
    init: true
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  go-app:
    build: ./go
    container_name: go-app
    expose:
      - "8080"
    networks:
      - web-network
    restart: unless-stopped
    init: true
    healthcheck:
      test: [ "CMD", "/app", "-healthcheck" ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  web-network:
    driver: bridge
