---
- name: Load GitHub runner secrets from environment
  set_fact:
    github_repo: "{{ lookup('env', 'GITHUB_REPO') }}"
    github_pat: "{{ lookup('env', 'GITHUB_PAT') }}"
  no_log: true

- name: Check if runner already configured
  stat:
    path: "{{ runner_dir }}/.runner"
  register: runner_configured

- name: Get latest actions-runner release info
  uri:
    url: https://api.github.com/repos/actions/runner/releases/latest
    return_content: true
  register: runner_release
  when: not runner_configured.stat.exists

- name: Create actions-runner directory
  file:
    path: "{{ runner_dir }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
  when: not runner_configured.stat.exists

- name: Download and extract actions-runner
  unarchive:
    src: "https://github.com/actions/runner/releases/download/{{ runner_release.json.tag_name }}/actions-runner-linux-x64-{{ runner_release.json.tag_name | regex_replace('^v', '') }}.tar.gz"
    dest: "{{ runner_dir }}"
    remote_src: true
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
  when: not runner_configured.stat.exists

- name: Get GitHub runner registration token
  uri:
    url: "https://api.github.com/repos/{{ github_repo }}/actions/runners/registration-token"
    method: POST
    headers:
      Authorization: "token {{ github_pat }}"
      Accept: "application/vnd.github.v3+json"
    status_code: 201
    return_content: true
  register: reg_token_response
  no_log: true
  when: not runner_configured.stat.exists

- name: Configure runner
  become_user: "{{ runner_user }}"
  command: >
    ./config.sh --url https://github.com/{{ github_repo }}
    --token {{ reg_token_response.json.token }}
    --name "{{ runner_user }}"
    --labels linux,self-hosted
    --unattended --replace
  args:
    chdir: "{{ runner_dir }}"
  no_log: true
  when: not runner_configured.stat.exists

- name: Install runner service
  command: "./svc.sh install {{ runner_user }}"
  args:
    chdir: "{{ runner_dir }}"
  when: not runner_configured.stat.exists

- name: Start runner service
  command: ./svc.sh start
  args:
    chdir: "{{ runner_dir }}"
  when: not runner_configured.stat.exists
