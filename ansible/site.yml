---
- name: Base setup on all nodes
  hosts: all
  become: true
  roles:
    - docker

- name: Init swarm on manager
  hosts: swarm_managers
  become: true
  tasks:
    - name: Check swarm status
      community.docker.docker_swarm_info:
      register: swarm_info
      failed_when: false

    - name: Init swarm
      community.docker.docker_swarm:
        state: present
        advertise_addr: "{{ ansible_host }}"
      when: not swarm_info.docker_swarm | default(false)

    - name: Get worker join token
      community.docker.docker_swarm_info:
        nodes: true
      register: swarm_info

    - name: Set fact for join token
      set_fact:
        worker_token: "{{ swarm_info.swarm_facts.JoinTokens.Worker }}"

- name: Join workers to swarm
  hosts: swarm_workers
  become: true
  tasks:
    - name: Check swarm status
      community.docker.docker_swarm_info:
      register: swarm_info
      failed_when: false

    - name: Join swarm
      community.docker.docker_swarm:
        state: join
        advertise_addr: "{{ ansible_host }}"
        remote_addrs: ["{{ hostvars[groups['swarm_managers'][0]].ansible_host }}:2377"]
        join_token: "{{ hostvars[groups['swarm_managers'][0]].worker_token }}"
      when: not swarm_info.docker_swarm | default(false)

- name: Label nodes
  hosts: swarm_managers
  become: true
  tasks:
    - name: Label nodes
      community.docker.docker_node:
        hostname: "{{ hostvars[item].ansible_hostname }}"
        labels:
          TAG: "{{ hostvars[item].tag_name }}"
        labels_state: replace
      loop: "{{ groups['all'] }}"

- name: Deploy stacks
  hosts: swarm_managers
  become: true
  vars:
    stacks:
      - { name: prod,  img_tag: latest, host_port: 80,   node_tag: prod }
      - { name: stage, img_tag: stage,  host_port: 8080, node_tag: stage }
      - { name: dev,   img_tag: dev,    host_port: 8081, node_tag: dev }
  tasks:
    - name: Copy compose file
      copy:
        src: "../docker-compose.yml"
        dest: "/tmp/docker-compose.yml"

    - name: Deploy stack
      community.docker.docker_stack:
        name: "{{ item.name }}"
        state: present
        compose:
          - "/tmp/docker-compose.yml"
      environment:
        BASE_REGISTRY: "{{ base_registry }}"
        IMG_TAG: "{{ item.img_tag }}"
        HOST_PORT: "{{ item.host_port }}"
        NODE_TAG: "{{ item.node_tag }}"
      loop: "{{ stacks }}"

- name: Setup GitHub Actions runner
  hosts: swarm_managers
  become: true
  roles:
    - github-runner
